name: myfoodlicense
description: "MyFoodLicense: FSSAI registration and licensing, the mobile app for myfoodlicense.com."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  go_router: ^18.0.2
  lucide_icons_flutter: ^3.1.20
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  image: ^4.10.1
  pdfrx: any
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  flutter_cashfree_pg_sdk: ^2.4.0+52
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#16a34a"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
