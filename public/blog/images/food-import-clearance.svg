<g font-family="Arial,Helvetica,sans-serif"><text x="45" y="48" font-size="16" font-weight="750" fill="#16634b"><tspan x="45" dy="0">MYFOODLICENSE.COM  /  FIELD GUIDE</tspan></text>
<text x="45" y="106" font-size="39" font-weight="750" fill="#153c32"><tspan x="45" dy="0">Plan clearance before the shipment leaves</tspan></text><text x="45" y="147" font-size="21" font-weight="450" fill="#52685f"><tspan x="45" dy="0">Importer licensing, product compliance and shipment clearance are distinct.</tspan></text>
