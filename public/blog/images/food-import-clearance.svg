34b"/><text x="73" y="413" font-size="18" font-weight="800" fill="white"><tspan x="73" dy="0">4</tspan></text><text x="110" y="414" font-size="24" font-weight="750" fill="#153c32"><tspan x="110" dy="0">FSSAI scrutiny</tspan></text><text x="69" y="459" font-size="23" font-weight="450" fill="#52685f"><tspan x="69" dy="0">Documents, inspection</tspan><tspan x="69" dy="32.199999999999996">and permitted corrections</tspan></text><path d="M398 443 L415 443" fill="none" stroke="#16634b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="367" width="350" height="157" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="455" cy="406" r="19" fill="#16634b"/><text x="448" y="413" font-size="18" font-weight="800" fill="white"><tspan x="448" dy="0">5</tspan></text><text x="485" y="414" font-size="24" font-weight="750" fill="#153c32"><tspan x="485" dy="0">Testing if required</tspan></text><text x="444" y="459" font-size="23" font-weight="450" fill="#52685f"><tspan x="444" dy="0">Track sampling and</tspan><tspan x="444" dy="32.199999999999996">the laboratory report</tspan></text><path d="M773 443 L790 443" fill="none" stroke="#16634b" stroke-width="3" marker-end="url(#arrow)"/><rect x="795" y="367" width="350" height="157" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="830" cy="406" r="19" fill="#16634b"/><text x="823" y="413" font-size="18" font-weight="800" fill="white"><tspan x="823" dy="0">6</tspan></text><text x="860" y="414" font-size="24" font-weight="750" fill="#153c32"><tspan x="860" dy="0">Decision &amp; release</tspan></text><text x="819" y="459" font-size="23" font-weight="450" fill="#52685f"><tspan x="819" dy="0">Read clearance or</tspan><tspan x="819" dy="32.199999999999996">non-conformance records</tspan></text>
