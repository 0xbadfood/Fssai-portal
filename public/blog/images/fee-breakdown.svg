<text x="45" y="106" font-size="39" font-weight="750" fill="#153c32"><tspan x="45" dy="0">Understand what the quotation includes</tspan></text><text x="45" y="147" font-size="21" font-weight="450" fill="#52685f"><tspan x="45" dy="0">Separate official payments from consultancy and conditional project work.</tspan></text>
<rect x="45" y="199" width="530" height="171" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="80" cy="238" r="19" fill="#16634b"/><text x="73" y="245" font-size="18" font-weight="800" fill="white"><tspan x="73" dy="0">1</tspan></text><text x="110" y="246" font-size="24" font-weight="750" fill="#153c32"><tspan x="110" dy="0">Government charge</tspan></text><text x="69" y="291" font-size="23" font-weight="450" fill="#52685f"><tspan x="69" dy="0">Official annual fee for</tspan><tspan x="69" dy="32.199999999999996">the applicable authorisation route</tspan></text><rect x="625" y="199" width="530" height="171" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="660" cy="238" r="19" fill="#16634b"/><text x="653" y="245" font-size="18" font-weight="800" fill="white"><tspan x="653" dy="0">2</tspan></text><text x="690" y="246" font-size="24" font-weight="750" fill="#153c32"><tspan x="690" dy="0">Professional service</tspan></text><text x="649" y="291" font-size="23" font-weight="450" fill="#52685f"><tspan x="649" dy="0">Agreed assessment, preparation,</tspan><tspan x="649" dy="32.199999999999996">filing and query-support work</tspan></text><text x="591" y="300" font-size="43" font-weight="750" fill="#16634b"><tspan x="591" dy="0">+</tspan></text><rect x="45" y="397" width="1110" height="125" rx="18" fill="#153c32" stroke="none"/><text x="72" y="440" font-size="29" font-weight="750" fill="white"><tspan x="72" dy="0">Conditional project work</tspan></text><text x="72" y="480" font-size="23" font-weight="450" fill="#e3eee5"><tspan x="72" dy="0">Product review • testing • artwork • other scope agreed for the actual project</tspan></text>
