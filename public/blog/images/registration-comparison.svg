<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Registration, State or Central?</title><desc id="desc">The general registration threshold is up to 1.5 crore rupees, State above 1.5 crore up to 50 crore, and Central above 50 crore, subject to activity-specific exceptions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16634b"/></marker></defs>
<rect width="1200" height="630" fill="#f1f5e9"/>
<circle cx="1130" cy="35" r="165" fill="#e5edd8"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="45" y="48" font-size="16" font-weight="750" fill="#16634b"><tspan x="45" dy="0">MYFOODLICENSE.COM  /  FIELD GUIDE</tspan></text>
<text x="45" y="106" font-size="39" font-weight="750" fill="#153c32"><tspan x="45" dy="0">Registration, State or Central?</tspan></text><text x="45" y="147" font-size="21" font-weight="450" fill="#52685f"><tspan x="45" dy="0">General turnover framework effective from 1 April 2026.</tspan></text>
<rect x="45" y="187" width="1110" height="64" rx="18" fill="#153c32" stroke="none"/><text x="69" y="228" font-size="27" font-weight="700" fill="white"><tspan x="69" dy="0">FIRST: match the business to its current activity-specific eligibility row.</tspan></text><rect x="45" y="275" width="350" height="192" rx="18" fill="white" stroke="#cfddcf"/><text x="69" y="319" font-size="30" font-weight="750" fill="#153c32"><tspan x="69" dy="0">Registration</tspan></text><text x="69" y="363" font-size="24" font-weight="450" fill="#52685f"><tspan x="69" dy="0">General band</tspan><tspan x="69" dy="33.599999999999994">Up to ₹1.5 crore</tspan></text><rect x="420" y="275" width="350" height="192" rx="18" fill="white" stroke="#cfddcf"/><text x="444" y="319" font-size="30" font-weight="750" fill="#153c32"><tspan x="444" dy="0">State licence</tspan></text><text x="444" y="363" font-size="24" font-weight="450" fill="#52685f"><tspan x="444" dy="0">General band</tspan><tspan x="444" dy="33.599999999999994">Above ₹1.5 crore</tspan><tspan x="444" dy="33.599999999999994">and up to ₹50 crore</tspan></text><rect x="795" y="275" width="350" height="192" rx="18" fill="white" stroke="#cfddcf"/><text x="819" y="319" font-size="30" font-weight="750" fill="#153c32"><tspan x="819" dy="0">Central licence</tspan></text><text x="819" y="363" font-size="24" font-weight="450" fill="#52685f"><tspan x="819" dy="0">General band</tspan><tspan x="819" dy="33.599999999999994">Above ₹50 crore</tspan></text><rect x="45" y="484" width="1110" height="62" rx="18" fill="#f7eacc" stroke="none"/><text x="69" y="523" font-size="26" font-weight="650" fill="#153c32"><tspan x="69" dy="0">Special KoB rows can override the turnover bands. Check before choosing.</tspan></text>
<path d="M45 568 H1155" stroke="#cbd8cb"/><text x="45" y="602" font-size="16" font-weight="450" fill="#52685f"><tspan x="45" dy="0">Original educational illustration • Read the applicable official source and product conditions.</tspan></text>
