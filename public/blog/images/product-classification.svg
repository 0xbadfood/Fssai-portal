<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Classify the product before the launch</title><desc id="desc">Four classification questions: matching standard, specialised regime, proprietary eligibility and unresolved approval questions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16634b"/></marker></defs>
<rect width="1200" height="630" fill="#f1f5e9"/>
<circle cx="1130" cy="35" r="165" fill="#e5edd8"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="45" y="48" font-size="16" font-weight="750" fill="#16634b"><tspan x="45" dy="0">MYFOODLICENSE.COM  /  FIELD GUIDE</tspan></text>
<text x="45" y="106" font-size="39" font-weight="750" fill="#153c32"><tspan x="45" dy="0">Classify the product before the launch</tspan></text><text x="45" y="147" font-size="21" font-weight="450" fill="#52685f"><tspan x="45" dy="0">Use the complete formulation, specifications and intended presentation.</tspan></text>
<rect x="45" y="191" width="540" height="143" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="80" cy="230" r="19" fill="#16634b"/><text x="73" y="237" font-size="18" font-weight="800" fill="white"><tspan x="73" dy="0">1</tspan></text><text x="110" y="238" font-size="24" font-weight="750" fill="#153c32"><tspan x="110" dy="0">Matching food standard?</tspan></text><text x="69" y="283" font-size="23" font-weight="450" fill="#52685f"><tspan x="69" dy="0">Compare the recipe and process</tspan><tspan x="69" dy="32.199999999999996">with the relevant requirements.</tspan></text><rect x="615" y="191" width="540" height="143" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="650" cy="230" r="19" fill="#16634b"/><text x="643" y="237" font-size="18" font-weight="800" fill="white"><tspan x="643" dy="0">2</tspan></text><text x="680" y="238" font-size="24" font-weight="750" fill="#153c32"><tspan x="680" dy="0">Specialised product rules?</tspan></text><text x="639" y="283" font-size="23" font-weight="450" fill="#52685f"><tspan x="639" dy="0">Check intended use, audience</tspan><tspan x="639" dy="32.199999999999996">and category exclusions.</tspan></text><rect x="45" y="357" width="540" height="143" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="80" cy="396" r="19" fill="#16634b"/><text x="73" y="403" font-size="18" font-weight="800" fill="white"><tspan x="73" dy="0">3</tspan></text><text x="110" y="404" font-size="24" font-weight="750" fill="#153c32"><tspan x="110" dy="0">Proprietary route supported?</tspan></text><text x="69" y="449" font-size="23" font-weight="450" fill="#52685f"><tspan x="69" dy="0">Establish ingredient status</tspan><tspan x="69" dy="32.199999999999996">and additive permissions.</tspan></text><rect x="615" y="357" width="540" height="143" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="650" cy="396" r="19" fill="#16634b"/><text x="643" y="403" font-size="18" font-weight="800" fill="white"><tspan x="643" dy="0">4</tspan></text><text x="680" y="404" font-size="24" font-weight="750" fill="#153c32"><tspan x="680" dy="0">Approval question unresolved?</tspan></text><text x="639" y="449" font-size="23" font-weight="450" fill="#52685f"><tspan x="639" dy="0">Identify the product or ingredient</tspan><tspan x="639" dy="32.199999999999996">and evidence requiring assessment.</tspan></text><text x="45" y="542" font-size="26" font-weight="750" fill="#153c32"><tspan x="45" dy="0">Keep product route, food-category code and business activity separate.</tspan></text>
<path d="M45 568 H1155" stroke="#cbd8cb"/><text x="45" y="602" font-size="16" font-weight="450" fill="#52685f"><tspan x="45" dy="0">Original educational illustration • Read the applicable official source and product conditions.</tspan></text>
</g></svg>
