<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Turn a proposed claim into a reviewable decision</title><desc id="desc">Four linked claims-review tasks followed by consistent use of the approved wording across customer-facing channels.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16634b"/></marker></defs>
<rect width="1200" height="630" fill="#f1f5e9"/>
<circle cx="1130" cy="35" r="165" fill="#e5edd8"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="45" y="48" font-size="16" font-weight="750" fill="#16634b"><tspan x="45" dy="0">MYFOODLICENSE.COM  /  FIELD GUIDE</tspan></text>
<text x="45" y="106" font-size="39" font-weight="750" fill="#153c32"><tspan x="45" dy="0">Turn a proposed claim into a reviewable decision</tspan></text><text x="45" y="147" font-size="21" font-weight="450" fill="#52685f"><tspan x="45" dy="0">The statement, criteria and product evidence must fit together.</tspan></text>
<rect x="45" y="190" width="540" height="141" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="80" cy="229" r="19" fill="#16634b"/><text x="73" y="236" font-size="18" font-weight="800" fill="white"><tspan x="73" dy="0">1</tspan></text><text x="110" y="237" font-size="24" font-weight="750" fill="#153c32"><tspan x="110" dy="0">Exact wording</tspan></text><text x="69" y="282" font-size="23" font-weight="450" fill="#52685f"><tspan x="69" dy="0">Record the SKU, audience</tspan><tspan x="69" dy="32.199999999999996">and every intended channel</tspan></text><rect x="610" y="190" width="540" height="141" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="645" cy="229" r="19" fill="#16634b"/><text x="638" y="236" font-size="18" font-weight="800" fill="white"><tspan x="638" dy="0">2</tspan></text><text x="675" y="237" font-size="24" font-weight="750" fill="#153c32"><tspan x="675" dy="0">Applicable criteria</tspan></text><text x="634" y="282" font-size="23" font-weight="450" fill="#52685f"><tspan x="634" dy="0">Identify the claim type</tspan><tspan x="634" dy="32.199999999999996">and relevant provisions</tspan></text><rect x="45" y="352" width="540" height="141" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="80" cy="391" r="19" fill="#16634b"/><text x="73" y="398" font-size="18" font-weight="800" fill="white"><tspan x="73" dy="0">3</tspan></text><text x="110" y="399" font-size="24" font-weight="750" fill="#153c32"><tspan x="110" dy="0">Product evidence</tspan></text><text x="69" y="444" font-size="23" font-weight="450" fill="#52685f"><tspan x="69" dy="0">Check reports, formula</tspan><tspan x="69" dy="32.199999999999996">and scientific substantiation</tspan></text><rect x="610" y="352" width="540" height="141" rx="18" fill="#ffffff" stroke="#cfddcf"/><circle cx="645" cy="391" r="19" fill="#16634b"/><text x="638" y="398" font-size="18" font-weight="800" fill="white"><tspan x="638" dy="0">4</tspan></text><text x="675" y="399" font-size="24" font-weight="750" fill="#153c32"><tspan x="675" dy="0">Context review</tspan></text><text x="634" y="444" font-size="23" font-weight="450" fill="#52685f"><tspan x="634" dy="0">Assess the complete</tspan><tspan x="634" dy="32.199999999999996">consumer-facing message</tspan></text><rect x="45" y="521" width="1110" height="33" rx="7" fill="#e8bc63" stroke="none"/><text x="70" y="545" font-size="20" font-weight="650" fill="#153c32"><tspan x="70" dy="0">Use the approved wording consistently on the pack, website, listings and campaigns.</tspan></text>
<path d="M45 568 H1155" stroke="#cbd8cb"/><text x="45" y="602" font-size="16" font-weight="450" fill="#52685f"><tspan x="45" dy="0">Original educational illustration • Read the applicable official source and product conditions.</tspan></text>
</g></svg>
